<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>GESTINOVA · Acceso</title><link rel="stylesheet" href="/ui.css"></head>
<body class="login-page"><main class="login-card"><div class="wordmark">GESTINOVA</div><p class="eyebrow">Planeamiento institucional</p><h1>Acceso al generador PEI</h1><p>Ingresá con la cuenta asignada por tu administrador.</p>{% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Usuario <input name="username" autocomplete="username" required autofocus></label><label>Contraseña <input type="password" name="password" autocomplete="current-password" required></label><button>Ingresar</button></form></main></body></html>
