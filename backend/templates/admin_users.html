<!doctype html><html lang="es"><head><meta charset="utf-8"><title>GESTINOVA · Usuarios</title></head><body><header><strong>GESTINOVA</strong><a href="{{ url_for('home') }}">Generador</a></header><main><h1>Administrar usuarios</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Usuario <input name="username" required></label><label>Contraseña temporal <input type="password" name="password" minlength="12" required></label><button>Crear usuario</button></form><table><thead><tr><th>Usuario</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>{% for user in users %}<tr><td>{{ user.username }}</td><td>{{ 'Activo' if user.is_active else 'Inactivo' }}</td><td>{% if user.id != current_user.id %}<form method="post" action="{{ url_for('admin_user_status', user_id=user.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="active" value="{{ 'false' if user.is_active else 'true' }}"><button>{{ 'Desactivar' if user.is_active else 'Activar' }}</button></form>{% endif %}<form method="post" action="{{ url_for('admin_user_password', user_id=user.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="password" name="password" minlength="12" aria-label="Nueva contraseña" required><button>Restablecer contraseña</button></form></td></tr>{% endfor %}</tbody></table></main></body></html>
